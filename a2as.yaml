        '**USER**: "Its for my washer"', '**AGENT**: "Okay, you''ve selected the Maytag Countertop Domestic', 'Microwave Oven
          (SN: GR75DSFN8346). Is that correct?"', '**USER**: "Yes"', '**AGENT**: "Great! Now, please describe the issue you''re
          experiencing', with your Maytag Countertop Domestic Microwave Oven in detail.", '**USER**: "My microwave oven is
